<section class="rsi-config">
  <label for="rsi-toggle">
    <input type="checkbox" id="rsi-toggle" />
    RSI
  </label>
  <div class="form-group">
    <label for="rsi_length">Length</label>
    <input type="text" id="rsi_length" placeholder="14" />
  </div>
  <div class="form-group">
    <label for="rsi_overbought">Overbought</label>
    <input type="text" id="rsi_overbought" placeholder="70" />
  </div>
  <div class="form-group">
    <label for="rsi_oversold">Oversold</label>
    <input type="text" id="rsi_oversold" placeholder="30" />
  </div>
</section>
