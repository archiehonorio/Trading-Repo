<div class="trading-grid">
  <div class="input-group">
    <div class="price-control">
      <label class="form-label">Price</label>
      <div class="market-price-checkbox">
        <input type="checkbox" id="market-price-checkbox" />
        <label for="market-price-checkbox">Use Market Price</label>
      </div>
    </div>
    <input
      type="text"
      class="form-input"
      id="price-input"
      placeholder="Market Price"
    />
  </div>
  <div class="input-group">
    <label class="form-label">Quantity</label>
    <input type="text" class="form-input" placeholder="6.5017" />
  </div>
  <div class="input-group">
    <label class="form-label">Leverage</label>
    <input type="number" class="form-input" value="5" min="1" max="75" />
  </div>
</div>
